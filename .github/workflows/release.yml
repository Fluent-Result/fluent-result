name: Build Fluent Result
true:
  workflow_dispatch: null
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Get GitHub App token
      if: ${{inputs.environment == 'prod'}}
      uses: actions/create-github-app-token@v3
      id: app-token
      with:
        client-id: ${{ vars.ACTIONS_APP_CLIENT_ID }}
        private-key: ${{ secrets.ACTIONS_APP_PRIVATE_KEY }}
        permission-contents: write
    - name: Checkout code
      uses: actions/checkout@v5
      with:
        token: ${{ steps.app-token.outputs.token }}
    - name: Configure git identity and remote for GitHub App
      run: 'git config --local user.name ''${{ steps.app-token.outputs.app-slug }}[bot]''

        git config --local user.email ''${{ vars.ACTIONS_APP_ID }}+${{ steps.app-token.outputs.app-slug
        }}[bot]@users.noreply.github.com''

        git remote set-url origin "https://x-access-token:${{ steps.app-token.outputs.token
        }}@github.com/${{ github.repository }}.git"'
    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        java-version: '8'
        distribution: temurin
        cache: maven
        server-id: ossrh
        server-username: ${{ secrets.OSSRH_USERNAME }}
        server-password: ${{ secrets.OSSRH_TOKEN }}
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
    - name: Cache Maven Wrapper
      uses: actions/cache@v4
      with:
        path: ~/.m2/wrapper
        key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties')
          }}
    - name: Set release version
      run: './mvnw -ntp versions:set -DgenerateBackupPoms=false -DremoveSnapshot

        RELEASE_VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)

        echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV

        git commit -a -m "Release $GITHUB_REPOSITORY-$RELEASE_VERSION"

        git tag -f "$GITHUB_REPOSITORY-$RELEASE_VERSION"

        '
    - name: Build with Maven
      run: ./mvnw -B deploy -P release
      env:
        MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
        MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
    - name: Set next version
      run: './mvnwmvn -B versions:set -DgenerateBackupPoms=false -DnextSnapshot

        NEXT_VERSION=$(./mvnwmvn -q help:evaluate -Dexpression=project.version -DforceStdout)

        git commit -a -m "$NEXT_VERSION"

        git push --atomic origin "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY-$RELEASE_VERSION"

        '
    - name: Create GitHub release
      if: ${{inputs.environment == 'prod'}}
      uses: ncipollo/release-action@v1
      with:
        generateReleaseNotes: true
        tag: ${{env.RELEASE_VERSION}}
