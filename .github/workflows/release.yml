name: Build Fluent Result

on:
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven Wrapper
        uses: actions/cache@v3
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Set release version
        run: |
          ./mvnw -ntp versions:set -DgenerateBackupPoms=false -DremoveSnapshot
          RELEASE_VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          git commit -a -m "Release $GITHUB_REPOSITORY-$RELEASE_VERSION"
          git tag -f "$GITHUB_REPOSITORY-$RELEASE_VERSION"

      - name: Build with Maven
        run: ./mvnw -B verify

      - name: Set next version
        run: |
          ./mvnwmvn -B versions:set -DgenerateBackupPoms=false -DnextSnapshot
          NEXT_VERSION=$(./mvnwmvn -q help:evaluate -Dexpression=project.version -DforceStdout)
          git commit -a -m "$NEXT_VERSION"
          git push --atomic origin "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY-$RELEASE_VERSION"

      - name: Create GitHub release
        if: ${{inputs.environment == 'prod'}}
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          tag: ${{env.RELEASE_VERSION}}