name: Build Fluent Result
on:
  workflow_dispatch:  # Allows manual triggering

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: '8'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven Wrapper
        uses: actions/cache@v5
        with:
          path: ~/.m2/wrapper
          key: maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set release version
        run: |
          ./mvnw -ntp versions:set -DgenerateBackupPoms=false -DremoveSnapshot
          RELEASE_VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          echo "RELEASE_VERSION=$RELEASE_VERSION" >> $GITHUB_ENV
          git commit -a -m "Release $GITHUB_REPOSITORY-$RELEASE_VERSION"
          git tag -f "$GITHUB_REPOSITORY-$RELEASE_VERSION"

      - name: Build and stage artifacts locally
        run: ./mvnw -B -P release deploy -DaltDeploymentRepository=local::file:./target/staging-deploy

      - name: Run JReleaser (sign, publish to Central, create GitHub release)
        uses: jreleaser/release-action@v2
        with:
          arguments: full-release
        env:
          JRELEASER_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JRELEASER_MAVENCENTRAL_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          JRELEASER_MAVENCENTRAL_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
          JRELEASER_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
          JRELEASER_GPG_PUBLIC_KEY: ${{ secrets.GPG_PUBLIC_KEY }}
          JRELEASER_GPG_SECRET_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Set next version
        run: |
          ./mvnw -B versions:set -DgenerateBackupPoms=false -DnextSnapshot
          NEXT_VERSION=$(./mvnw -q help:evaluate -Dexpression=project.version -DforceStdout)
          git commit -a -m "$NEXT_VERSION"
          git push --atomic origin "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY-$RELEASE_VERSION"